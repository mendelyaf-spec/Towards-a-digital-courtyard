<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Digital Courtyard</title>
  <meta name="description" content="An infinite canvas. Place shapes, cut shapes out of photos, wander." />

  <!-- Installable app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3a8a3a" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Courtyard" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="background/background.css" />
</head>
<body>
  <!-- HOME: your canvases + courtyards (rendered by home.js) -->
  <div id="homeView" class="view"></div>

  <!-- CANVAS: a single named infinite canvas -->
  <div id="canvasView" class="view" hidden>
    <button id="canvasBack" class="back-btn" type="button" title="Back to home">‹ home</button>
    <span id="canvasTitle" class="canvas-title"></span>

    <!-- The viewport holds the transformable world -->
    <div id="viewport" class="viewport">
      <div id="world" class="world"></div>
    </div>

    <!-- Bottom toolbar: choose what to drop into the canvas -->
    <nav id="toolbar" class="toolbar" aria-label="Add to canvas">
      <button class="tool" data-shape="rect" type="button" title="Rectangle" aria-label="Add rectangle">
        <span class="tool__glyph tool__glyph--rect"></span>
      </button>
      <button class="tool" data-shape="circle" type="button" title="Circle" aria-label="Add circle">
        <span class="tool__glyph tool__glyph--circle"></span>
      </button>
      <button class="tool" data-shape="text" type="button" title="Text" aria-label="Add text">
        <span class="tool__glyph tool__glyph--text">T</span>
      </button>
      <span class="toolbar__sep" aria-hidden="true"></span>
      <button class="tool tool--photo" id="photoBtn" type="button" title="Add a photo and cut out its shape" aria-haspopup="true" aria-expanded="false" aria-label="Add a photo">
        <span class="tool__glyph tool__glyph--photo"></span>
        <span class="tool__label">cut from photo</span>
      </button>
      <input id="photoCamera" class="visually-hidden" type="file" accept="image/*" capture="environment" />
      <input id="photoUpload" class="visually-hidden" type="file" accept="image/*" />
      <span class="toolbar__sep" aria-hidden="true"></span>
      <button class="tool tool--bg" id="bgToggle" type="button" title="Background mode: shapes you place become backgrounds" aria-pressed="false">
        <span class="tool__glyph tool__glyph--bg"></span>
        <span class="tool__label">background</span>
      </button>
    </nav>

    <!-- Zoom readout / reset -->
    <button id="resetView" class="reset-view" type="button" title="Reset view">
      <span id="zoomLabel">100%</span>
    </button>
  </div>

  <!-- COURTYARD: two canvases around a shared void (rendered by courtyard.js) -->
  <div id="courtyardView" class="view" hidden></div>

  <!-- Take-photo / upload chooser -->
  <div id="photoMenu" class="photo-menu" role="menu" hidden>
    <button class="photo-menu__item" data-source="camera" type="button" role="menuitem">take photo</button>
    <button class="photo-menu__item" data-source="upload" type="button" role="menuitem">upload</button>
  </div>

  <!-- Contextual tools for the selected item -->
  <div id="itemBar" class="item-bar" hidden>
    <label class="item-bar__color" title="Choose color">
      <input id="inkColor" type="color" value="#b04b4b" />
    </label>
    <button class="item-bar__btn" data-act="draw" type="button" title="Draw on this">✎ draw</button>
    <button class="item-bar__btn" data-act="note" type="button" title="Attach a note">＋ note</button>
  </div>

  <!-- Shape-extraction studio -->
  <div id="studio" class="studio" hidden>
    <div class="studio__panel" role="dialog" aria-modal="true" aria-labelledby="studioTitle">
      <h2 id="studioTitle" class="studio__title">cut out the shape</h2>
      <p class="studio__hint">We trace the subject by clearing away the background. Drag the slider until the edges look right.</p>
      <div class="studio__preview">
        <canvas id="studioCanvas"></canvas>
      </div>
      <label class="studio__control">
        <span>background sensitivity</span>
        <input id="tolerance" type="range" min="4" max="120" value="40" />
      </label>
      <div class="studio__actions">
        <button id="studioCancel" class="btn btn--ghost" type="button">cancel</button>
        <button id="studioPlace" class="btn btn--solid" type="button">place on canvas</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
  <script>
    // Register the service worker so the app installs and works offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
